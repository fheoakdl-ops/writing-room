<!--
배포용 집필실 v7
권장: 이 파일명을 index.html 로 바꿔 GitHub Pages 또는 Cloudflare Pages 같은 무료 정적 호스팅에 업로드하세요.
로컬 file:// 실행도 집필 기능은 되지만, 뉴스 패널은 https:// 호스팅 환경을 전제로 합니다.
-->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>집필실 v2</title>
<style>
:root{
  --bg:#f3f0e9; --panel:#ebe6dc; --paper:#fffdf8; --text:#25231f;
  --muted:#8b857b; --line:#d9d2c6; --accent:#536151; --accent2:#dfe7dc;
  --danger:#9a5f5f; --shadow:0 10px 35px rgba(0,0,0,.07);
}
body.dark{
  --bg:#171715; --panel:#1e1e1b; --paper:#242420; --text:#ece8df;
  --muted:#a49d92; --line:#3a3934; --accent:#b4c2af; --accent2:#2d352c;
  --danger:#d39b9b; --shadow:0 10px 35px rgba(0,0,0,.2);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
}
.app{height:100%;display:grid;grid-template-columns:220px minmax(520px,1fr) 330px}
.sidebar{
  background:var(--panel); border-right:1px solid var(--line);
  padding:16px 12px; overflow:auto;
}
.brand{font-size:17px;font-weight:800;padding:4px 8px 14px}
.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
button{
  border:1px solid var(--line); background:var(--paper); color:var(--text);
  border-radius:10px; padding:9px 11px; cursor:pointer;
}
button:hover{filter:brightness(.98)}
button.primary{background:var(--accent);color:white;border-color:var(--accent)}
.episode-list{display:flex;flex-direction:column;gap:6px}
.ep{
  display:flex;align-items:center;gap:7px;
  border:1px solid transparent;border-radius:10px;padding:8px;
  cursor:pointer;
}
.ep:hover{background:rgba(127,127,127,.08)}
.ep.active{background:var(--paper);border-color:var(--line)}
.ep .num{font-size:13px;color:var(--muted);width:28px}
.ep .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.ep .chars{font-size:11px;color:var(--muted)}
.main{min-width:0;height:100%;display:flex;flex-direction:column}
.top{
  display:flex;gap:10px;align-items:center;padding:16px 20px 12px;
}
#title{
  flex:1;min-width:0;font-size:21px;font-weight:800;
  border:none;background:transparent;color:var(--text);outline:none;
}
.paper-wrap{flex:1;min-height:0;padding:0 20px}
.paper{
  height:100%;background:var(--paper);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--shadow);overflow:hidden;
}
textarea{
  width:100%;height:100%;resize:none;border:none;outline:none;
  background:transparent;color:var(--text);
  padding:42px 54px;
  font-family:"Nanum Myeongjo","Batang","Noto Serif KR",serif;
  font-size:20px;line-height:1.95;letter-spacing:.01em;
}
.bottom{
  display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;
  padding:12px 20px 18px;
}
.stats{font-size:14px;color:var(--muted)}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:7px}
.bar{height:100%;width:0;background:var(--accent);transition:.15s}
.tiny{font-size:12px;color:var(--muted);margin-top:7px}
.goalbox{font-size:13px;color:var(--muted);white-space:nowrap}
input[type=number]{
  width:80px;border:1px solid var(--line);background:var(--paper);
  color:var(--text);border-radius:8px;padding:7px;
}
.youtube.locked{opacity:.45;cursor:not-allowed}
.youtube.unlocked{border-color:var(--accent);font-weight:800}
.modal-bg{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);
  align-items:center;justify-content:center;padding:20px;
}
.modal{
  width:min(520px,95vw);background:var(--paper);border:1px solid var(--line);
  border-radius:16px;padding:18px;box-shadow:var(--shadow);
}
.modal h3{margin:0 0 10px}
.modal p{color:var(--muted);font-size:14px;line-height:1.6}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.small{font-size:12px;color:var(--muted)}
@media(max-width:760px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  textarea{padding:28px 24px;font-size:18px}
  .bottom{grid-template-columns:1fr 1fr}
  .stats{grid-column:1/-1}
}

.news-panel{background:var(--panel);border-left:1px solid var(--line);padding:16px 13px;overflow:auto}
.news-panel h2{font-size:17px;margin:3px 4px 5px}.news-note{font-size:11px;color:var(--muted);line-height:1.5;margin:0 4px 10px}
.news-item{padding:12px 4px;border-bottom:1px solid var(--line)}.news-item a{color:var(--text);text-decoration:none;font-size:13px;font-weight:700;line-height:1.55}.news-item a:hover{text-decoration:underline}.news-meta{font-size:11px;color:var(--muted);margin-top:5px}
#newsStatus{font-size:11px;color:var(--muted);margin:7px 4px}.news-refresh{width:100%;margin-bottom:4px}
@media(max-width:1100px){.app{grid-template-columns:190px 1fr}.news-panel{display:none}}

.host-badge{
 display:inline-block;margin-top:7px;padding:4px 7px;border:1px solid var(--line);
 border-radius:7px;font-size:10px;color:var(--muted)
}
.news-error{font-size:12px;color:var(--muted);line-height:1.6;margin-top:12px}

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">집필실</div>
    <div class="side-actions">
      <button id="newBtn" class="primary">+ 새 회차</button>
      <button id="deleteBtn">삭제</button>
    </div>
    <div id="episodeList" class="episode-list"></div>
    <div class="small" style="padding:14px 8px 0">
      회차를 눌러 자유롭게 이동할 수 있습니다.<br>
      모든 내용은 브라우저에 자동 저장됩니다.
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <input id="title" aria-label="회차 제목">
      <button id="exportBtn">현재 TXT</button>
      <button id="exportAllBtn">전체 TXT</button>
      <button id="darkBtn">☾</button>
    </div>

    <div class="paper-wrap">
      <div class="paper">
        <textarea id="editor" spellcheck="false"
          placeholder="여기서 바로 시작하세요.

완성된 문장을 쓰려고 하지 않아도 됩니다.
지금 보이는 장면, 대사, 생각부터 적으세요."></textarea>
      </div>
    </div>

    <div class="bottom">
      <div class="stats">
        <div>현재 회차 <b id="count">0</b>자 · 전체 <b id="totalCount">0</b>자 · 오늘 <b id="todayCount">0</b>자 · 자동저장됨</div>
        <div class="progress"><div id="bar" class="bar"></div></div>
        <div id="hint" class="tiny">목표까지 1,000자</div>
      </div>
      <div class="goalbox">오늘 목표 <input id="goal" type="number" min="100" step="100" value="5000"> 자</div>
      <button id="youtubeBtn" class="youtube locked">YouTube 🔒</button>
    </div>
  </main>
  <aside class="news-panel">
    <h2>오늘 꼭 볼 뉴스</h2>
    <p class="news-note">가십·연예·스포츠를 빼고, World·Business·Technology의 주요 헤드라인만 자동으로 불러옵니다.</p>
    <div id="hostBadge" class="host-badge">호스팅 상태 확인 중…</div>
    <button id="newsRefresh" class="news-refresh">뉴스 새로고침</button>
    <div id="newsStatus">OKSURF 뉴스 API 연결 준비 중…</div>
    <div id="newsList"></div>
  </aside>
</div>

<div id="confirmModal" class="modal-bg">
  <div class="modal">
    <h3 id="modalTitle">확인</h3>
    <p id="modalText"></p>
    <div class="modal-actions">
      <button id="modalCancel">취소</button>
      <button id="modalOk" class="primary">확인</button>
    </div>
  </div>
</div>

<script>
const editor = document.getElementById('editor');
const title = document.getElementById('title');
const episodeList = document.getElementById('episodeList');
const count = document.getElementById('count');
const totalCount = document.getElementById('totalCount');
const todayCount = document.getElementById('todayCount');
const goalInput = document.getElementById('goal');
const bar = document.getElementById('bar');
const hint = document.getElementById('hint');
const youtubeBtn = document.getElementById('youtubeBtn');

const KEY_DATA = 'writer_v2_data';
const KEY_GOAL = 'writer_v2_goal_5000';
const KEY_DARK = 'writer_v2_dark';
const KEY_DAY = 'writer_v2_day';
const KEY_DAYBASE = 'writer_v2_daybase';

let saveTimer;
let data = loadData();

function defaultData(){
  return {
    currentId: 1,
    nextId: 2,
    episodes: [{id:1, title:'제 1화', text:''}]
  };
}
function loadData(){
  try{
    const raw=localStorage.getItem(KEY_DATA);
    if(!raw) return defaultData();
    const parsed=JSON.parse(raw);
    if(!parsed.episodes || !parsed.episodes.length) return defaultData();
    return parsed;
  }catch(e){ return defaultData(); }
}
function saveDataNow(){
  localStorage.setItem(KEY_DATA,JSON.stringify(data));
}
function currentEp(){
  return data.episodes.find(e=>e.id===data.currentId) || data.episodes[0];
}
function todayKey(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function allChars(){
  return data.episodes.reduce((s,e)=>s+e.text.length,0);
}
function ensureDay(){
  const t=todayKey();
  const old=localStorage.getItem(KEY_DAY);
  if(old!==t){
    localStorage.setItem(KEY_DAY,t);
    localStorage.setItem(KEY_DAYBASE,String(allChars()));
  }
}
function saveCurrentFromUI(){
  const ep=currentEp();
  ep.title=title.value || ('제 '+ep.id+'화');
  ep.text=editor.value;
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveCurrentFromUI();
  saveTimer=setTimeout(()=>saveDataNow(),120);
  renderStats();
  renderList();
}
function loadCurrentToUI(){
  const ep=currentEp();
  title.value=ep.title;
  editor.value=ep.text;
  renderStats();
}
function renderList(){
  episodeList.innerHTML='';
  data.episodes
    .slice()
    .sort((a,b)=>a.id-b.id)
    .forEach((ep,idx)=>{
      const row=document.createElement('div');
      row.className='ep'+(ep.id===data.currentId?' active':'');
      row.onclick=()=>{
        saveCurrentFromUI(); saveDataNow();
        data.currentId=ep.id; saveDataNow();
        loadCurrentToUI(); renderList(); editor.focus();
      };
      const n=document.createElement('div'); n.className='num'; n.textContent=(idx+1);
      const nm=document.createElement('div'); nm.className='name'; nm.textContent=ep.title || ('제 '+(idx+1)+'화');
      const ch=document.createElement('div'); ch.className='chars'; ch.textContent=ep.text.length.toLocaleString();
      row.append(n,nm,ch);
      episodeList.appendChild(row);
    });
}
function renderStats(){
  ensureDay();
  saveCurrentFromUI();
  const ep=currentEp();
  const total=allChars();
  const base=Number(localStorage.getItem(KEY_DAYBASE)||0);
  const daily=Math.max(0,total-base);
  const goal=Math.max(100,Number(goalInput.value)||5000);

  count.textContent=ep.text.length.toLocaleString();
  totalCount.textContent=total.toLocaleString();
  todayCount.textContent=daily.toLocaleString();

  const pct=Math.min(100,(daily/goal)*100);
  bar.style.width=pct+'%';
  if(daily>=goal){
    youtubeBtn.classList.remove('locked');
    youtubeBtn.classList.add('unlocked');
    youtubeBtn.textContent='YouTube 🔓';
    hint.textContent='오늘 목표 달성. 이제 봐도 됩니다.';
  }else{
    youtubeBtn.classList.add('locked');
    youtubeBtn.classList.remove('unlocked');
    youtubeBtn.textContent='YouTube 🔒';
    hint.textContent='목표까지 '+(goal-daily).toLocaleString()+'자';
  }
}

function nextEpisodeTitle(){
  const nums=data.episodes.map(e=>{
    const m=(e.title||'').match(/(\d+)/);
    return m?Number(m[1]):0;
  });
  const next=Math.max(data.episodes.length, ...nums)+1;
  return '제 '+next+'화';
}

function showConfirm(text,onOk){
  const bg=document.getElementById('confirmModal');
  document.getElementById('modalText').textContent=text;
  bg.style.display='flex';
  const ok=document.getElementById('modalOk');
  const cancel=document.getElementById('modalCancel');

  function close(){
    bg.style.display='none';
    ok.onclick=null; cancel.onclick=null;
  }
  cancel.onclick=close;
  ok.onclick=()=>{close();onOk();};
}

document.getElementById('newBtn').onclick=()=>{
  saveCurrentFromUI(); saveDataNow();
  const id=data.nextId++;
  const ep={id,title:nextEpisodeTitle(),text:''};
  data.episodes.push(ep);
  data.currentId=id;
  saveDataNow();
  loadCurrentToUI(); renderList(); editor.focus();
};

document.getElementById('deleteBtn').onclick=()=>{
  if(data.episodes.length===1){
    alert('마지막 회차는 삭제할 수 없습니다.');
    return;
  }
  const ep=currentEp();
  showConfirm('"'+ep.title+'" 회차를 정말 삭제할까요? 이 작업은 되돌릴 수 없습니다.',()=>{
    const idx=data.episodes.findIndex(e=>e.id===data.currentId);
    data.episodes.splice(idx,1);
    const fallback=data.episodes[Math.max(0,idx-1)] || data.episodes[0];
    data.currentId=fallback.id;
    saveDataNow();
    loadCurrentToUI(); renderList();
  });
};

editor.addEventListener('input',scheduleSave);
title.addEventListener('input',scheduleSave);
goalInput.value=localStorage.getItem(KEY_GOAL)||5000;
goalInput.addEventListener('input',()=>{
  localStorage.setItem(KEY_GOAL,goalInput.value);
  renderStats();
});

document.getElementById('darkBtn').onclick=()=>{
  document.body.classList.toggle('dark');
  localStorage.setItem(KEY_DARK,document.body.classList.contains('dark')?'1':'0');
};
if(localStorage.getItem(KEY_DARK)==='1') document.body.classList.add('dark');

function downloadText(filename,text){
  const blob=new Blob([text],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),500);
}
document.getElementById('exportBtn').onclick=()=>{
  saveCurrentFromUI(); saveDataNow();
  const ep=currentEp();
  downloadText((ep.title.trim()||'원고')+'.txt',ep.title+'\n\n'+ep.text);
};
document.getElementById('exportAllBtn').onclick=()=>{
  saveCurrentFromUI(); saveDataNow();
  const text=data.episodes
    .slice().sort((a,b)=>a.id-b.id)
    .map(e=>e.title+'\n\n'+e.text)
    .join('\n\n\n==============================\n\n\n');
  downloadText('전체원고.txt',text);
};

youtubeBtn.onclick=()=>{
  ensureDay();
  saveCurrentFromUI();
  const base=Number(localStorage.getItem(KEY_DAYBASE)||0);
  const daily=Math.max(0,allChars()-base);
  const goal=Math.max(100,Number(goalInput.value)||5000);
  if(daily<goal){
    alert('아직 '+(goal-daily).toLocaleString()+'자가 남았습니다.');
    editor.focus();
    return;
  }
  window.open('https://www.youtube.com/','_blank');
};

window.addEventListener('beforeunload',()=>{
  saveCurrentFromUI(); saveDataNow();
});

ensureDay();
loadCurrentToUI();
renderList();
renderStats();
setTimeout(()=>editor.focus(),120);

</script>







<script>
/* v8: OKSURF CORS 전용 뉴스 API
   공식 프론트엔드용 엔드포인트:
   https://ok.surf/api/v1/cors/news-section
   API 키/회원가입 불필요.
*/
(function(){
  const list = document.getElementById('newsList');
  const status = document.getElementById('newsStatus');
  const btn = document.getElementById('newsRefresh');
  const badge = document.getElementById('hostBadge');
  if(!list || !status || !btn) return;

  const CACHE='writer_oksurf_news_cache_v8';
  const CACHE_TIME='writer_oksurf_news_cache_time_v8';
  const BLOCK=/entertainment|sports|celebrity|movie|music|football|soccer|baseball|basketball|golf|연예|스포츠|배우|가수|아이돌|드라마|예능|축구|야구|농구|골프/i;

  if(badge) badge.textContent = (location.protocol==='https:' ? '호스팅 모드 · HTTPS' : '로컬 모드');

  function loadCache(){
    try{return JSON.parse(localStorage.getItem(CACHE)||'[]')}catch(e){return []}
  }
  function saveCache(items){
    try{
      localStorage.setItem(CACHE,JSON.stringify(items));
      localStorage.setItem(CACHE_TIME,new Date().toISOString());
    }catch(e){}
  }
  function cacheTime(){
    const raw=localStorage.getItem(CACHE_TIME);
    if(!raw) return '';
    const d=new Date(raw);
    return isNaN(d)?'':d.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  }

  function flattenResponse(data){
    // API may return a plain article array, or grouped section arrays/objects.
    if(Array.isArray(data)) return data;
    if(data && Array.isArray(data.articles)) return data.articles;
    if(data && typeof data==='object'){
      const out=[];
      for(const [section,val] of Object.entries(data)){
        if(Array.isArray(val)){
          val.forEach(x=>out.push({...x,_section:section}));
        }else if(val && Array.isArray(val.articles)){
          val.articles.forEach(x=>out.push({...x,_section:section}));
        }
      }
      return out;
    }
    return [];
  }

  function normalize(data){
    let arr=flattenResponse(data).map(x=>({
      title:String(x.title||'').trim(),
      link:x.link||x.url||'',
      source:x.source||x.publisher||'',
      section:x.section||x._section||''
    })).filter(x=>x.title && x.link && !BLOCK.test(x.title));

    const seen=new Set();
    arr=arr.filter(x=>{
      const k=x.title.toLowerCase().replace(/[^a-z0-9가-힣]/g,'').slice(0,55);
      if(!k || seen.has(k)) return false;
      seen.add(k); return true;
    });

    // Prefer Reuters and Yonhap if present, then keep the rest.
    const priority=[];
    const rest=[];
    arr.forEach(x=>{
      if(/reuters|연합뉴스|yonhap/i.test(x.source+' '+x.title)) priority.push(x);
      else rest.push(x);
    });
    return [...priority,...rest].slice(0,12);
  }

  function render(items,note){
    list.innerHTML='';
    if(!items.length){
      list.innerHTML='<div class="news-note" style="margin-top:18px">표시할 주요 뉴스가 없습니다.</div>';
      status.textContent=note||'뉴스 없음';
      return;
    }
    items.forEach(x=>{
      const box=document.createElement('div'); box.className='news-item';
      const a=document.createElement('a');
      a.href=x.link; a.target='_blank'; a.rel='noopener noreferrer'; a.textContent=x.title;

      const meta=document.createElement('div'); meta.className='news-meta';
      const label=[x.section,x.source].filter(Boolean).join(' · ');
      meta.textContent=label || '주요 뉴스';

      box.append(a,meta);
      list.appendChild(box);
    });
    status.textContent=note||('주요 뉴스 '+items.length+'개');
  }

  async function fetchNews(){
    const r=await fetch('https://ok.surf/api/v1/cors/news-section',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sections:['World','Business','Technology']}),
      cache:'no-store'
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    return normalize(await r.json());
  }

  async function refresh(){
    btn.disabled=true;
    status.textContent='최신 주요 뉴스 확인 중…';
    try{
      const items=await fetchNews();
      if(!items.length) throw new Error('empty');
      saveCache(items);
      render(items,'업데이트 완료 · '+new Date().toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}));
    }catch(e){
      const cached=loadCache();
      if(cached.length){
        render(cached,'실시간 연결 실패 · 마지막 성공 '+cacheTime());
      }else{
        list.innerHTML='<div class="news-note" style="margin-top:18px">뉴스 연결에 실패했습니다. 잠시 뒤 새로고침을 눌러주세요.</div>';
        status.textContent='OKSURF 뉴스 API 연결 실패';
      }
    }finally{
      btn.disabled=false;
    }
  }

  btn.onclick=refresh;
  const cached=loadCache();
  if(cached.length) render(cached,'마지막 성공 '+cacheTime()+' · 최신 뉴스 확인 중…');
  refresh();
})();
</script>

</body>
</html>
